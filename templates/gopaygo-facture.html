<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoPayGo – Reçu de transfert</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #d9d9d9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow: hidden;
      padding: 30px 16px;
    }

    .page {
      width: 794px;
      height: 1123px; max-height: 1123px;
      background: #fff;
      position: relative;
      box-shadow: 0 10px 50px rgba(0,0,0,0.22);
      display: flex;
      flex-direction: column;
    }

    .header { width: 100%; flex-shrink: 0; }
    .header img { width: 100%; display: block; object-fit: cover; }

    .body { flex: 1; padding: 28px 60px 20px; }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f5a623;
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      padding: 8px 35px;
      border-radius: 50px;
      margin-bottom: 25px;
      letter-spacing: 1.5px;
    }

    .data-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1.5px solid #ddd3be;
      border-radius: 14px;
      overflow: hidden;
    }
    .data-table tbody tr { height: 52px; }
    .data-table tbody tr:not(:last-child) td { border-bottom: 1.5px solid #ddd3be; }
    .data-table tbody tr:nth-child(odd)  td { background: #fdf6e8; }
    .data-table tbody tr:nth-child(even) td { background: #ffffff; }

    .data-table td.lbl {
      width: 50%;
      padding: 0 24px;
      vertical-align: middle;
      font-size: 17px;
      font-weight: 400;
      color: #2a2a2a;
      border-left: 5px solid #f5a623;
    }
    .data-table td.val {
      width: 50%;
      padding: 0 32px;
      vertical-align: middle;
      text-align: right;
      font-size: 17px;
      font-weight: 500;
      color: #2a2a2a;
    }
    .data-table tbody tr:first-child td.val { font-size: 20px; font-weight: 700; }
    td.val.gris { color: #999; font-style: italic; font-weight: 400; }

    .footer {
      margin: 0 60px;
      padding: 14px 0 20px;
      border-top: 1px solid #ececec;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #bbb;
      font-size: 11.5px;
    }

    @media print {
      body { background: none; padding: 0; margin: 0; }
      .page { 
        width: 210mm; 
        height: 297mm; 
        max-height: 297mm; 
        box-shadow: none; 
        page-break-after: avoid;
        page-break-inside: avoid;
        overflow: hidden;
      }
      * {
        page-break-inside: avoid;
      }
    }
  </style>
</head>
