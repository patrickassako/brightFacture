<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrightFacture - Gestion de Factures</title>
    <link rel="stylesheet" href="styles.css">
    <script src="icons.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="header.jpg" alt="Logo" class="logo">
            <span class="brand-name">BrightFacture</span>
        </div>
        <div class="navbar-menu">
            <button class="nav-item active" data-view="dashboard" onclick="navigateTo('dashboard')">
                <script>document.write(getIcon('dashboard'));</script>
                <span class="nav-text">Dashboard</span>
            </button>
            <button class="nav-item" data-view="factures" onclick="navigateTo('factures')">
                <script>document.write(getIcon('factures'));</script>
                <span class="nav-text">Factures</span>
            </button>
            <button class="nav-item" data-view="contacts" onclick="navigateTo('contacts')">
                <script>document.write(getIcon('contacts'));</script>
                <span class="nav-text">Contacts</span>
            </button>
            <button class="nav-item" data-view="profil" onclick="navigateTo('profil')">
                <script>document.write(getIcon('user'));</script>
                <span class="nav-text">Profil</span>
            </button>
        </div>
    </nav>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="view container">
        <div class="view-header">
            <h1>Dashboard</h1>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-factures">0</div>
                <div class="stat-label">Total Factures</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="factures-payees">0</div>
                <div class="stat-label">Payées</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="factures-attente">0</div>
                <div class="stat-label">En attente</div>
            </div>
        </div>

        <div class="section">
            <h2>Dernières factures</h2>
            <div id="recent-factures" class="recent-list"></div>
        </div>
    </div>

    <!-- Factures View -->
    <div id="factures-view" class="view container hidden">
        <div class="view-header">
            <h1>Factures</h1>
            <button class="btn-primary" onclick="showNewFacture()">
                <script>document.write(getIcon('plus'));</script> Nouvelle
            </button>
        </div>
        <div id="factures-list" class="cards-grid"></div>
    </div>

    <!-- Contacts View -->
    <div id="contacts-view" class="view container hidden">
        <div class="view-header">
            <h1>Contacts</h1>
            <button class="btn-primary" onclick="showNewContact()">
                <script>document.write(getIcon('plus'));</script> Nouveau
            </button>
        </div>
        <div id="contacts-list" class="cards-grid"></div>
    </div>

    <!-- Profil View -->
    <div id="profil-view" class="view container hidden">
        <div class="view-header">
            <h1>Mon Profil</h1>
        </div>

        <!-- Informations utilisateur -->
        <div class="profile-section">
            <h2>Informations personnelles</h2>
            <div class="profile-card">
                <div class="profile-info">
                    <div class="info-group">
                        <label>Nom</label>
                        <div class="info-value" id="profile-nom">-</div>
                    </div>
                    <div class="info-group">
                        <label>Email</label>
                        <div class="info-value" id="profile-email">-</div>
                    </div>
                    <div class="info-group">
                        <label>Rôle</label>
                        <div class="info-value">
                            <span class="badge-role" id="profile-role">-</span>
                        </div>
                    </div>
                    <div class="info-group">
                        <label>Membre depuis</label>
                        <div class="info-value" id="profile-created">-</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Changement de mot de passe -->
        <div class="profile-section">
            <h2>Sécurité</h2>
            <div class="profile-card">
                <form id="password-form" onsubmit="changePassword(event)">
                    <div class="form-group">
                        <label for="current-password">Mot de passe actuel *</label>
                        <input type="password" id="current-password" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">Nouveau mot de passe *</label>
                        <input type="password" id="new-password" required minlength="6">
                        <small>Minimum 6 caractères</small>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmer le mot de passe *</label>
                        <input type="password" id="confirm-password" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary">
                        Changer le mot de passe
                    </button>
                </form>
            </div>
        </div>

        <!-- Déconnexion -->
        <div class="profile-section">
            <h2>Session</h2>
            <div class="profile-card">
                <p class="text-gray">Déconnectez-vous de votre compte pour terminer votre session.</p>
                <button onclick="logout()" class="btn-danger" style="margin-top: 16px;">
                    <script>document.write(getIcon('close'));</script>
                    Se déconnecter
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Facture -->
    <div id="facture-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Facture</h2>
                <button class="btn-close" onclick="closeModal('facture-modal')">
                    <script>document.write(getIcon('close'));</script>
                </button>
            </div>
            <form id="facture-form" onsubmit="saveFacture(event)">
                <input type="hidden" id="facture-id">
                
                <div class="form-group">
                    <label for="nom">Nom du client *</label>
                    <input type="text" id="nom" name="nom" required list="contacts-datalist">
                    <datalist id="contacts-datalist"></datalist>
                    <div class="checkbox-group" style="margin-top: 8px;">
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                            <input type="checkbox" id="save-as-contact" checked>
                            <span style="font-size: 13px; color: var(--gray-600);">Enregistrer comme contact</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="montantADeposer">Montant à déposer *</label>
                    <div class="input-group">
                        <input type="number" id="montantADeposer" name="montantADeposer" step="0.01" required>
                        <select id="deviseDeposer" name="deviseDeposer" required>
                            <option value="EUR">EUR (€)</option>
                            <option value="XAF">XAF (F)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fraisTransaction">Frais de transaction *</label>
                    <div class="input-group">
                        <input type="number" id="fraisTransaction" name="fraisTransaction" step="0.01" required>
                        <select id="deviseFrais" name="deviseFrais" required>
                            <option value="EUR">EUR (€)</option>
                            <option value="XAF">XAF (F)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="montantARecevoir">Montant à recevoir *</label>
                    <div class="input-group">
                        <input type="number" id="montantARecevoir" name="montantARecevoir" step="0.01" required>
                        <select id="deviseRecevoir" name="deviseRecevoir" required>
                            <option value="EUR">EUR (€)</option>
                            <option value="XAF">XAF (F)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taux">Taux *</label>
                        <input type="number" id="taux" name="taux" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="statut">Statut *</label>
                        <select id="statut" name="statut" required>
                            <option value="Payée">Payée</option>
                            <option value="En attente">En attente</option>
                            <option value="Annulée">Annulée</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="numero">Numéro *</label>
                        <input type="text" id="numero" name="numero" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal('facture-modal')">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Contact -->
    <div id="contact-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Contact</h2>
                <button class="btn-close" onclick="closeModal('contact-modal')">
                    <script>document.write(getIcon('close'));</script>
                </button>
            </div>
            <form id="contact-form" onsubmit="saveContact(event)">
                <input type="hidden" id="contact-id">
                
                <div class="form-group">
                    <label for="contact-nom">Nom *</label>
                    <input type="text" id="contact-nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="contact-numero">Téléphone *</label>
                    <input type="tel" id="contact-numero" name="numero" required>
                </div>

                <div class="form-group">
                    <label for="contact-email">Email</label>
                    <input type="email" id="contact-email" name="email">
                </div>

                <div class="form-group">
                    <label for="contact-adresse">Adresse</label>
                    <textarea id="contact-adresse" name="adresse" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label for="contact-notes">Notes</label>
                    <textarea id="contact-notes" name="notes" rows="3"></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal('contact-modal')">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
